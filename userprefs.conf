# Set your personal hyprland configuration here
# See https://wiki.hypr.land/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hypr.land/Configuring/Variables/#input
input {
    # kb_layout = us
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat
    # numlock_by_default = true

    # 🔗 See https://wiki.hypr.land/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}



#	windowrules!!!!!!!!
# Workspace 1: PyCharm
windowrule = match:class pycharm, workspace 1

# Workspace 3: Spotify en Vesktop
windowrule = match:class spotify-launcher, workspace 3
windowrule = match:class vesktop, workspace 3

# Special Workspace: Firefox
windowrule = match:class firefox, workspace special

# Start applicaties direct op de juiste plek
exec-once = [workspace 1 silent] pycharm
exec-once = [workspace 3 silent] spotify
exec-once = [workspace 3 silent] vesktop
exec-once = [workspace special silent] firefox
